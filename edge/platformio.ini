; Configuração do PlatformIO para o dispositivo do AlertaCheia.
; Placa: ESP32 DevKit (simulado no Wokwi). Framework: Arduino.
; Para compilar: abra a pasta edge/ no VS Code e clique em "Build" (✓) na barra do PlatformIO.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Evita erro do linker quando o caminho da pasta tem acento (ex.: "Área de Trabalho")
extra_scripts = post:scripts/sem_mapa.py

; Bibliotecas baixadas automaticamente pelo PlatformIO
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13   ; display OLED 128x64
  adafruit/Adafruit GFX Library@^1.11.11 ; desenho de texto no display
  knolleary/PubSubClient@^2.8         ; cliente MQTT (ThingSpeak)
