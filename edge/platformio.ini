; Placa ESP32 DevKit com framework Arduino (simulada no Wokwi)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Evita o erro do linker com acento no caminho da pasta
extra_scripts = post:scripts/sem_mapa.py

; Bibliotecas baixadas automaticamente
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13       ; display OLED
  adafruit/Adafruit GFX Library@^1.11.11  ; texto no display
  knolleary/PubSubClient@^2.8             ; cliente MQTT
